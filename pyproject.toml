[project]
name = "banking-rag-vector-search"
version = "1.0.0"
description = "Banking Secure RAG demo with local AI query parsing, vector search, and field-level masking"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.35,<2.0",
    "chromadb>=0.5,<2.0",
    "sentence-transformers>=3.0,<6.0",
    "torch>=2.2",
    "numpy>=1.24,<3.0",
    "pandas>=2.0,<3.0",
    "pydantic>=2.0,<3.0",
    "requests>=2.31,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]
